[workspace]
resolver = "2"
members = ["crates/walnut-core", "crates/walnut-cli", "crates/walnut-installer"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/NexusMcNexis/walnut-installer"
authors = ["Luke Woods"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
sha2 = "0.10"
tar = "0.4"
ruzstd = "0.9"
crc32fast = "1"
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
