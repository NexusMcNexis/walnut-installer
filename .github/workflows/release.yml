# M4: release builds. On a pull request: build every binary for x86_64 and
# aarch64, run the tests, the end-to-end sample in a clean container (a
# temporary HOME and a fake Steam, never a real one) and the size budget.
# On a v* tag: the same, then a GitHub Release with the binaries, their
# SHA-256 sums and the notes in docs/releases/<tag>.md.
name: Release
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml", "scripts/**", "crates/**", "Cargo.*"]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo test --workspace
      # The graphical installer and the builder: glibc, built on Ubuntu 22.04
      # so they run on older distributions too (glibc 2.35 and later).
      - run: cargo build --release -p walnut-installer -p walnut-builder -p walnut-cli
      # Text mode and the CLI: static musl, run anywhere.
      - run: cargo build --release --target ${{ matrix.arch }}-unknown-linux-musl -p walnut-installer -p walnut-cli --no-default-features
      - name: Collect
        run: |
          mkdir -p out
          cp target/release/walnut-installer target/release/walnut-builder out/
          cp target/${{ matrix.arch }}-unknown-linux-musl/release/walnut out/walnut
          cp target/${{ matrix.arch }}-unknown-linux-musl/release/walnut-installer out/walnut-installer-text
      - run: ./scripts/size_budget.sh out
      - name: End to end in a clean container
        run: |
          docker run --rm -v "$PWD:/w" -w /w -e WALNUT_BIN=/w/out debian:12 bash -c \
            'apt-get update -qq && apt-get install -y -qq python3 > /dev/null && ./scripts/e2e.sh'
      - name: Name by architecture
        run: |
          cd out
          for f in *; do mv "$f" "$f-linux-${{ matrix.arch }}"; done
          sha256sum * > SHA256SUMS-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: walnut-${{ matrix.arch }}
          path: out/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat dist/SHA256SUMS-* > dist/SHA256SUMS && rm dist/SHA256SUMS-*
          gh release create "${GITHUB_REF_NAME}" dist/* --title "Walnut Installer ${GITHUB_REF_NAME}" --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
